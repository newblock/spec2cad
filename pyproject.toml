[project]
name = "spec2cad"
version = "0.1.0"
description = "spec -> STEP，双源交叉验证（solidcraft 主内核 + FreeCAD/OCCT oracle）"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
